<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121418">
  <meta name="description" content="A numerical abstraction of Marvel Snap.">
  <title>Theoretical Snap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121418'/%3E%3Cg fill='none' stroke='%23a0b8cc' stroke-width='2'%3E%3Ccircle cx='16' cy='32' r='7'/%3E%3Ccircle cx='32' cy='32' r='7'/%3E%3Ccircle cx='48' cy='32' r='7'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
<svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v3m10 7h-3M12 22v-3M2 12h3"/></symbol>
    <symbol id="i-lab" viewBox="0 0 24 24"><path d="M9 3h6m-5 0v6L4 19a1.3 1.3 0 0 0 1.2 2h13.6a1.3 1.3 0 0 0 1.2-2L14 9V3M8 14h8"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1.2 7M20 4v6h-6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-6 6 6 6M2 10h12a7 7 0 0 1 7 7v3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.1M10 9h.1M14 9h.1M18 9h.1M6 12h.1M10 12h.1M14 12h.1M18 12h.1M7 15h10"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4m0 16h17M8 15l4-5 4 2 5-8"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4 1-4-2-6-2m12 5v-4a3.5 3.5 0 0 0-1-2.7c3.3-.4 6.8-1.6 6.8-7.3a5.7 5.7 0 0 0-1.5-4c.2-.6.7-2.2-.2-4 0 0-1.2-.4-4.1 1.5a14 14 0 0 0-7.5 0C4.6-.4 3.4 0 3.4 0c-.9 1.8-.4 3.4-.2 4a5.7 5.7 0 0 0-1.5 4c0 5.7 3.5 6.9 6.8 7.3A3.5 3.5 0 0 0 7.5 18v4" transform="translate(1 1) scale(.9)"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" href="./">theoretical <span>snap</span></a>
    <nav class="mode-nav" aria-label="Workspace mode">
      <button class="mode-button active" data-mode="training" aria-pressed="true">Training</button>
      <button class="mode-button" data-mode="playground" aria-pressed="false">Playground</button>
    </nav>
    <div class="header-actions">
      <button class="icon-button" data-action="settings" aria-label="Settings" title="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
      <button class="icon-button help-button" data-action="help" aria-label="Help" title="Help">?</button>
    </div>
  </header>

  <main class="workspace">
    <div class="position-bar">
      <div class="position-name">Position <span id="exercise-number">01</span></div>
      <button class="text-button" id="edit-position" data-action="edit-position" hidden>Edit position</button>
      <button class="icon-button" data-action="reset" aria-label="Reset position" title="Reset position"><svg class="icon"><use href="#i-refresh"/></svg></button>
    </div>

    <div class="table-wrap">
      <div class="board-area" id="board-area">
        <span class="side-label opponent-label">Opponent</span>
        <span class="side-label player-label">You</span>
        <div class="game-table" id="game-table" aria-label="Three-lane board"></div>
        <div id="comparison-arrows" class="comparison-arrows" aria-hidden="true"></div>
        <section class="results-overlay" id="results-overlay" aria-label="Result" aria-live="polite" hidden></section>
      </div>
      <div class="turn-rail">
        <span class="rail-label">Turn</span>
        <div id="turn-selector" class="turn-selector" aria-label="Choose a turn. Earlier turns are below, later turns above."></div>
      </div>
    </div>

    <section class="hand-section" aria-label="Your hand">
      <div class="hand-meta">
        <span id="selection-note" aria-live="polite"></span>
        <span class="energy-budget" aria-label="Available energy"><span id="energy-remaining">6</span><span class="energy-divider"> / </span><span id="energy-total">6</span><span class="energy-label">energy</span></span>
      </div>
      <div class="hand" id="hand" aria-label="Cards in hand"></div>
    </section>

    <div class="action-bar">
      <button class="quiet-button" id="undo-button" data-action="undo" disabled><svg class="icon"><use href="#i-undo"/></svg>Undo</button>
      <button class="quiet-button" id="clear-button" data-action="clear" disabled>Clear</button>
      <span class="action-spacer"></span>
      <button class="quiet-button" id="retry-button" data-action="retry" hidden>Retry</button>
      <button class="primary-button" id="submit-button" data-action="submit">Submit</button>
    </div>
    <footer class="workspace-footer">
      <button class="text-button" data-action="model">Numerical model</button>
      <a href="https://github.com/willavawang/theoretical-snap" target="_blank" rel="noreferrer">Source</a>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live-status" role="status" aria-live="polite"></div>
  <dialog id="app-dialog" class="app-dialog"><div id="dialog-content"></div></dialog>
</body>
</html>
