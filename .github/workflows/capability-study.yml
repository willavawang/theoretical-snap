name: Bounded capability sensitivity study
on:
  push:
    branches: [codex/milestone-one-mockup]
    paths:
      - 'studies/capabilities/*.cjs'
      - 'studies/capabilities/*.py'
      - 'studies/capabilities/spec.md'
      - 'requirements-turn6.txt'
      - '.github/workflows/capability-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-turn6.txt
      - run: python -m pip install -r requirements-turn6.txt
      - name: Regression and effect representation controls
        run: node --test tests/*.test.cjs tests/solver/*.test.cjs tests/endgame/*.test.cjs tests/two-turn/*.test.cjs studies/capabilities/test.cjs
      - name: Independent LP and strategic information controls
        run: python -m unittest discover -s studies/capabilities -p test_reference.py -v
      - name: Run fixed pilot with independent best-response checks
        run: timeout 900 python studies/capabilities/run.py --out studies/capabilities/results --log-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-sensitivity-report
          path: studies/capabilities/results/
          retention-days: 90
